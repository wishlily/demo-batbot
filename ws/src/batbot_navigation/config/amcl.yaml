amcl:
  ros__parameters:
    use_sim_time: false
    tf_broadcast: true
    transform_tolerance: 0.5

    min_particles: 300
    max_particles: 2000
    kld_err: 0.05
    kld_z: 0.99

    update_min_d: 0.20
    update_min_a: 0.20
    resample_interval: 1
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1

    odom_model_type: diff
    odom_alpha1: 0.2
    odom_alpha2: 0.2
    odom_alpha3: 0.2
    odom_alpha4: 0.2
    odom_alpha5: 0.2

    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /batbot/scan

    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

    save_pose_rate: 0.5
